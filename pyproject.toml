[project]
name = "quant-portfolio-optimizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "cvxpy>=1.9.3",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "cvxpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qpo.analytics.*", "qpo.backtest.performance.*"]
disallow_untyped_defs = true